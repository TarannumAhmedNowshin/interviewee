services:
  db:
    image: pgvector/pgvector:pg16
    container_name: interviewwee-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-interviewwee}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-interviewwee}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Sandboxed code execution for the Coding Arena.
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: interviewwee-piston
    privileged: true
    # Dev-only: corporate TLS inspection breaks the container's runtime downloads
    # from GitHub. "0" lets Piston fetch runtimes past an intercepting proxy; set
    # PISTON_TLS_REJECT=1 in .env for a real deployment that trusts the CA properly.
    environment:
      NODE_TLS_REJECT_UNAUTHORIZED: "${PISTON_TLS_REJECT:-0}"
    ports:
      - "2000:2000"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000
    restart: unless-stopped

volumes:
  pgdata:
  piston_packages:
